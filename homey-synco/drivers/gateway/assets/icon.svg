<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Gateway controller - monochrome for Homey -->

  <!-- Outer rectangle (device body) -->
  <rect x="2" y="10" width="60" height="44" rx="4" fill="none" stroke="black" stroke-width="2"/>

  <!-- Central circular panel -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="black" stroke-width="2"/>

  <!-- Display screen -->
  <rect x="18" y="16" width="28" height="14" rx="2" fill="black"/>

  <!-- Control buttons row -->
  <circle cx="20" cy="38" r="3" fill="black"/>
  <circle cx="30" cy="38" r="3" fill="black"/>
  <circle cx="40" cy="38" r="3" fill="black"/>

  <!-- Navigation dial -->
  <circle cx="32" cy="48" r="5" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="32" cy="48" r="2" fill="black"/>
</svg>
