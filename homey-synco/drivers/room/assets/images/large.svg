<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="roomTempGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#009999"/>
      <stop offset="100%" style="stop-color:#00cccc"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="#009999"/>

  <!-- Thermometer body -->
  <rect x="185" y="100" width="130" height="200" rx="65" fill="white"/>

  <!-- Thermometer bulb -->
  <circle cx="250" cy="350" r="90" fill="white"/>

  <!-- Temperature fill -->
  <rect x="215" y="140" width="70" height="160" fill="url(#roomTempGrad)"/>
  <circle cx="250" cy="350" r="60" fill="#009999"/>

  <!-- Temperature scale marks -->
  <line x1="140" y1="160" x2="175" y2="160" stroke="white" stroke-width="6"/>
  <line x1="140" y1="200" x2="175" y2="200" stroke="white" stroke-width="6"/>
  <line x1="140" y1="240" x2="175" y2="240" stroke="white" stroke-width="6"/>
  <line x1="140" y1="280" x2="175" y2="280" stroke="white" stroke-width="6"/>

  <!-- Room indicator -->
  <rect x="320" y="120" width="100" height="80" rx="8" fill="white" fill-opacity="0.3"/>
  <text x="370" y="170" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle">21</text>
  <text x="370" y="190" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">C</text>
</svg>
