<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      margin: 0;
      background-color: #f5f5f5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #009999;
    }

    .button-container {
      margin-top: 30px;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #009999;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #008080;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .error-message {
      color: #d32f2f;
      margin-top: 10px;
      display: none;
      font-size: 14px;
    }

    .info-text {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="info-text" data-i18n="pair.login.info">
    Enter the connection details for your OZW772/OZW672 gateway.
  </div>

  <div class="form-group">
    <label for="host" data-i18n="pair.login.host">Gateway IP Address</label>
    <input type="text" id="host" placeholder="192.168.1.12" autocomplete="off" />
  </div>

  <div class="form-group">
    <label for="username" data-i18n="pair.login.username">Username</label>
    <input type="text" id="username" placeholder="Administrator" autocomplete="off" />
  </div>

  <div class="form-group">
    <label for="password" data-i18n="pair.login.password">Password</label>
    <input type="password" id="password" autocomplete="off" />
  </div>

  <div class="error-message" id="error"></div>

  <div class="button-container">
    <button id="connect" data-i18n="pair.login.connect">Connect</button>
  </div>

  <script>
    const hostInput = document.getElementById('host');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const connectButton = document.getElementById('connect');
    const errorElement = document.getElementById('error');

    function showError(message) {
      errorElement.textContent = message;
      errorElement.style.display = 'block';
    }

    function hideError() {
      errorElement.style.display = 'none';
    }

    function setLoading(loading) {
      connectButton.disabled = loading;
      connectButton.textContent = loading ? 'Connecting...' : 'Connect';
    }

    connectButton.addEventListener('click', async () => {
      hideError();

      const host = hostInput.value.trim();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!host) {
        showError('Please enter the gateway IP address');
        return;
      }

      if (!username) {
        showError('Please enter a username');
        return;
      }

      if (!password) {
        showError('Please enter a password');
        return;
      }

      setLoading(true);

      try {
        const result = await Homey.emit('login', { host, username, password });

        if (result === true) {
          await Homey.showView('list_devices');
        } else {
          showError(result || 'Connection failed. Please check your credentials.');
        }
      } catch (err) {
        showError(err.message || 'An error occurred while connecting');
      } finally {
        setLoading(false);
      }
    });

    // Allow Enter key to submit
    [hostInput, usernameInput, passwordInput].forEach(input => {
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          connectButton.click();
        }
      });
    });
  </script>
</body>
</html>
