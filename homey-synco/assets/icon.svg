<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="tempGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#009999;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00cccc;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="230" fill="#009999"/>

  <!-- House outline -->
  <path d="M250 80 L400 180 L400 400 L100 400 L100 180 Z"
        fill="none" stroke="white" stroke-width="16" stroke-linejoin="round"/>

  <!-- Roof -->
  <path d="M80 190 L250 60 L420 190"
        fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Thermometer body -->
  <rect x="210" y="180" width="80" height="160" rx="40" ry="40" fill="white"/>

  <!-- Thermometer bulb -->
  <circle cx="250" cy="340" r="50" fill="white"/>

  <!-- Temperature indicator -->
  <rect x="230" y="200" width="40" height="120" fill="url(#tempGradient)"/>
  <circle cx="250" cy="340" r="35" fill="#009999"/>

  <!-- Temperature marks -->
  <line x1="175" y1="220" x2="195" y2="220" stroke="white" stroke-width="4"/>
  <line x1="175" y1="260" x2="195" y2="260" stroke="white" stroke-width="4"/>
  <line x1="175" y1="300" x2="195" y2="300" stroke="white" stroke-width="4"/>
</svg>
