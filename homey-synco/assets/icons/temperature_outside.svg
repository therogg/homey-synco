<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Thermometer -->
  <rect x="24" y="8" width="12" height="36" rx="6" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="30" cy="50" r="10" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="30" cy="50" r="5" fill="black"/>
  <rect x="27" y="20" width="6" height="26" fill="black"/>

  <!-- Sun rays (outdoor indicator) -->
  <circle cx="50" cy="16" r="6" fill="black"/>
  <line x1="50" y1="4" x2="50" y2="8" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="24" x2="50" y2="28" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="16" x2="42" y2="16" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="16" x2="62" y2="16" stroke="black" stroke-width="2" stroke-linecap="round"/>
</svg>
