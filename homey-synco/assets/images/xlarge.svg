<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="tempGradXL" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#009999"/>
      <stop offset="100%" style="stop-color:#00cccc"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="#009999"/>

  <!-- House outline -->
  <path d="M500 160 L800 360 L800 800 L200 800 L200 360 Z"
        fill="none" stroke="white" stroke-width="24" stroke-linejoin="round"/>
  <path d="M160 380 L500 120 L840 380"
        fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Thermometer -->
  <rect x="420" y="360" width="160" height="320" rx="80" fill="white"/>
  <circle cx="500" cy="680" r="100" fill="white"/>
  <rect x="460" y="400" width="80" height="240" fill="url(#tempGradXL)"/>
  <circle cx="500" cy="680" r="70" fill="#009999"/>

  <!-- Temperature marks -->
  <line x1="350" y1="440" x2="400" y2="440" stroke="white" stroke-width="8"/>
  <line x1="350" y1="520" x2="400" y2="520" stroke="white" stroke-width="8"/>
  <line x1="350" y1="600" x2="400" y2="600" stroke="white" stroke-width="8"/>
</svg>
