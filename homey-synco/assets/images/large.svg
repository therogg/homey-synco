<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="tempGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#009999"/>
      <stop offset="100%" style="stop-color:#00cccc"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="#009999"/>

  <!-- House outline -->
  <path d="M250 80 L400 180 L400 400 L100 400 L100 180 Z"
        fill="none" stroke="white" stroke-width="12" stroke-linejoin="round"/>
  <path d="M80 190 L250 60 L420 190"
        fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Thermometer -->
  <rect x="210" y="180" width="80" height="160" rx="40" fill="white"/>
  <circle cx="250" cy="340" r="50" fill="white"/>
  <rect x="230" y="200" width="40" height="120" fill="url(#tempGrad)"/>
  <circle cx="250" cy="340" r="35" fill="#009999"/>

  <!-- Temperature marks -->
  <line x1="175" y1="220" x2="200" y2="220" stroke="white" stroke-width="4"/>
  <line x1="175" y1="260" x2="200" y2="260" stroke="white" stroke-width="4"/>
  <line x1="175" y1="300" x2="200" y2="300" stroke="white" stroke-width="4"/>
</svg>
